version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=sqlite:///./dashboard.db
      - UPLOAD_DIR=uploads
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:80
    volumes:
      - backend_data:/app/uploads
      - backend_dbs:/app/dbs
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
  backend_dbs:
